# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# Render Blueprint: Audio Processing Engine
#
# One Docker web service (./Dockerfile: Python 3.12, ffmpeg, gunicorn) serving the pydub operations under
# /audio (audio_processing_engine/blueprint.py). It is stateless: no disk, every request uploads its audio and
# gets the result back.
#
# API_TOKEN is generated by Render: copy it from the service's Environment tab. Every /audio request needs it
# in the header `X-API-Key: <token>`. /healthz is open.

services:
  - type: web
    name: audio-processing-engine
    runtime: docker
    # Starter = 0.5 CPU / 512 MB. pydub keeps a whole decoded recording in memory (30 min of 44.1 kHz stereo
    # is ~300 MB), so keep MAX_UPLOAD_MB modest here or move to standard (2 GB) for long recordings.
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - render.yaml
        - audio_processing_engine/**
        - wsgi.py
        - Dockerfile
        - .dockerignore
        - requirements.txt
      ignoredPaths:
        - "**/*.md"
    envVars:
      - key: API_TOKEN
        generateValue: true
      - key: MAX_UPLOAD_MB
        value: "50"
      # gunicorn: processes x threads = requests processed at once. One process keeps memory bounded.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_THREADS
        value: "4"
      - key: GUNICORN_TIMEOUT
        value: "600"
